<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Contact Demo - Vanshika Tilwani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body style="background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

    <div style="max-width: 480px; width: 100%; background: white; border-radius: 20px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);">

        <!-- Profile Section -->
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 100px; height: 100px; margin: 0 auto 16px; border-radius: 50%; overflow: hidden; border: 3px solid #F45A57;">
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=100&h=100&fit=crop" alt="Vanshika Tilwani" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1 style="font-size: 26px; font-weight: 900; color: #1a1a1a; margin-bottom: 8px;">Vanshika Tilwani</h1>
            <div style="font-size: 16px; font-weight: 700; color: #F45A57; margin-bottom: 4px;">Managing Director (RCIC)</div>
            <div style="font-size: 14px; color: #6b7280;">Rise N Sky Immigration</div>
        </div>

        <!-- Save Contact Buttons -->
        <div style="display: grid; gap: 12px; margin-bottom: 24px;">

            <!-- Method 1: vCard Download (Works on all devices) -->
            <button onclick="saveContactVCard()" style="width: 100%; padding: 18px; background: linear-gradient(135deg, #F45A57, #F67B79); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(244, 90, 87, 0.3); transition: all 0.3s ease;">
                <i class="fas fa-download" style="margin-right: 8px;"></i>
                Save Contact (vCard)
            </button>

            <!-- Method 2: Direct Share (Mobile Only) -->
            <button onclick="shareContact()" style="width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); transition: all 0.3s ease;">
                <i class="fas fa-share-alt" style="margin-right: 8px;"></i>
                Share Contact (Mobile)
            </button>

            <!-- Method 3: QR Code Generate -->
            <button onclick="generateQRCode()" style="width: 100%; padding: 18px; background: linear-gradient(135deg, #10b981, #34d399); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.3s ease;">
                <i class="fas fa-qrcode" style="margin-right: 8px;"></i>
                Generate QR Code
            </button>
        </div>

        <!-- QR Code Display Area -->
        <div id="qrCodeContainer" style="display: none; text-align: center; padding: 20px; background: #f9fafb; border-radius: 12px; margin-bottom: 16px;">
            <div style="font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 12px;">Scan to Save Contact</div>
            <div id="qrCode"></div>
        </div>

        <!-- Info -->
        <div style="background: #fef2f2; padding: 16px; border-radius: 10px; border-left: 4px solid #F45A57;">
            <div style="font-size: 12px; font-weight: 700; color: #F45A57; margin-bottom: 8px;">💡 How it works:</div>
            <div style="font-size: 13px; color: #374151; line-height: 1.6;">
                <strong>vCard:</strong> Downloads a .vcf file that opens in your contacts app<br>
                <strong>Share:</strong> Uses native share (works on mobile only)<br>
                <strong>QR Code:</strong> Scan with camera to save contact
            </div>
        </div>

    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // ===========================================
        // METHOD 1: Generate and Download vCard
        // Works on: iOS, Android, Desktop
        // ===========================================
        function saveContactVCard() {
            // Create vCard content (version 3.0 for better compatibility)
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:Vanshika Tilwani
N:Tilwani;Vanshika;;;
ORG:Rise N Sky Immigration
TITLE:Managing Director (RCIC)
TEL;TYPE=CELL,VOICE:+16475002641
TEL;TYPE=WORK,VOICE:+16475598840
TEL;TYPE=CELL,VOICE:+917990979334
EMAIL;TYPE=INTERNET:info@risenskyimmigration.com
URL:https://www.risenskyimmigration.com
ADR;TYPE=WORK:;;18-7001 Steeles Avenue West;Toronto;ON;M9W 0A2;Canada
ADR;TYPE=WORK:;;B-304 Stellar, Sindhu Bhavan Road;Ahmedabad;Gujarat;380054;India
NOTE:"Leaders In Migration Solution" - Regulated Canadian Immigration Consultant, Commissioner Of Oaths Ontario
END:VCARD`;

            // Create blob from vCard data
            const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8' });

            // Create download link
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Vanshika_Tilwani_Contact.vcf';

            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Clean up
            URL.revokeObjectURL(url);

            // Show success message
            alert('✅ Contact card downloaded! Check your downloads folder and open the .vcf file to add to contacts.');
        }

        // ===========================================
        // METHOD 2: Native Share API
        // Works on: iOS Safari, Android Chrome, Mobile browsers
        // ===========================================
        async function shareContact() {
            // Check if Web Share API is supported
            if (!navigator.share) {
                alert('❌ Share not supported on this browser. Please use "Save Contact (vCard)" button instead.');
                return;
            }

            try {
                // Create vCard content
                const vCard = `BEGIN:VCARD
VERSION:3.0
FN:Vanshika Tilwani
N:Tilwani;Vanshika;;;
ORG:Rise N Sky Immigration
TITLE:Managing Director (RCIC)
TEL;TYPE=CELL,VOICE:+16475002641
TEL;TYPE=WORK,VOICE:+16475598840
TEL;TYPE=CELL,VOICE:+917990979334
EMAIL;TYPE=INTERNET:info@risenskyimmigration.com
URL:https://www.risenskyimmigration.com
ADR;TYPE=WORK:;;18-7001 Steeles Avenue West;Toronto;ON;M9W 0A2;Canada
ADR;TYPE=WORK:;;B-304 Stellar, Sindhu Bhavan Road;Ahmedabad;Gujarat;380054;India
NOTE:"Leaders In Migration Solution"
END:VCARD`;

                // Create blob and file
                const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8' });
                const file = new File([blob], 'Vanshika_Tilwani.vcf', { type: 'text/vcard' });

                // Use Web Share API
                await navigator.share({
                    title: 'Vanshika Tilwani - Contact',
                    text: 'Save contact for Vanshika Tilwani, Managing Director at Rise N Sky Immigration',
                    files: [file]
                });

                console.log('✅ Contact shared successfully!');
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Share failed:', error);
                    alert('❌ Share failed. Please use "Save Contact (vCard)" button instead.');
                }
            }
        }

        // ===========================================
        // METHOD 3: Generate QR Code
        // Works on: All devices with camera
        // ===========================================
        function generateQRCode() {
            const container = document.getElementById('qrCodeContainer');
            const qrDiv = document.getElementById('qrCode');

            // Clear previous QR code
            qrDiv.innerHTML = '';

            // Create vCard content for QR code
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:Vanshika Tilwani
N:Tilwani;Vanshika;;;
ORG:Rise N Sky Immigration
TITLE:Managing Director (RCIC)
TEL;TYPE=CELL:+16475002641
TEL;TYPE=WORK:+16475598840
TEL;TYPE=CELL:+917990979334
EMAIL:info@risenskyimmigration.com
URL:https://www.risenskyimmigration.com
ADR;TYPE=WORK:;;18-7001 Steeles Avenue West;Toronto;ON;M9W 0A2;Canada
NOTE:Leaders In Migration Solution
END:VCARD`;

            // Generate QR code
            new QRCode(qrDiv, {
                text: vCard,
                width: 256,
                height: 256,
                colorDark: "#1a1a1a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Show container
            container.style.display = 'block';

            // Scroll to QR code
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===========================================
        // BONUS: Add to Calendar Event (Optional)
        // ===========================================
        function addToCalendar() {
            // Example: Add a consultation appointment
            const event = {
                title: 'Consultation with Vanshika Tilwani',
                description: 'Immigration consultation at Rise N Sky Immigration',
                location: '18-7001 Steeles Avenue West, Toronto, ON M9W 0A2',
                start: new Date('2024-12-15T10:00:00'),
                end: new Date('2024-12-15T11:00:00')
            };

            // Create iCal format
            const ical = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:${event.title}
DESCRIPTION:${event.description}
LOCATION:${event.location}
DTSTART:${event.start.toISOString().replace(/[-:]/g, '').split('.')[0]}Z
DTEND:${event.end.toISOString().replace(/[-:]/g, '').split('.')[0]}Z
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([ical], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'consultation.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
